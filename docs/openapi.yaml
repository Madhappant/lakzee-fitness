  /api/metrics:
    get:
      tags: [Observability & Audit]
      summary: Fetch APM latency, cache hit rate, pool status, Web Vitals, alerts, and immutable Audit Logs
      parameters:
        - $ref: "#/components/parameters/BranchHeaderParam"
        - $ref: "#/components/parameters/BranchQueryParam"
        - name: action
          in: query
          required: false
          schema:
            type: string
            enum: [ADMIN_LOGIN, LOGIN_FAILED, MEMBER_CREATED, MEMBER_UPDATED, MEMBER_DELETED, ROLE_CHANGED, BRANCH_CREATED, BRANCH_UPDATED]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 25
      responses:
        "200":
          description: Full telemetry and AuditLog payload returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  status:
                    type: string
                    const: success
                  data:
                    type: object
                    properties:
                      branchId:
                        type: string
                      apm:
                        type: object
                      cache:
                        type: object
                      pool:
                        type: object
                      system:
                        type: object
                      webVitals:
                        type: object
                      analytics:
                        type: ["object", "null"]
                      recentErrors:
                        type: array
                        items:
                          type: object
                      alerts:
                        type: array
                        items:
                          type: object
                      auditLogs:
                        type: array
                        items:
                          $ref: "#/components/schemas/AuditLogEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/telemetry/client:
    post:
      tags: [Observability & Audit]
      summary: Ingest redacted frontend Web Vitals and uncaught browser errors
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [web-vital, error]
                name:
                  type: string
                  enum: [LCP, INP, CLS, FCP, TTFB]
                value:
                  type: number
                  minimum: 0
                  maximum: 120000
                rating:
                  type: string
                  enum: [good, needs-improvement, poor]
                route:
                  type: string
                message:
                  type: string
                stack:
                  type: string
                componentStack:
                  type: string
      responses:
        "202":
          description: Telemetry sample accepted asynchronously
        "400":
          $ref: "#/components/responses/BadRequest"
