services:
  - type: web
    name: lakzee-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build:prod
    startCommand: npm run db:deploy && npm run db:migrate:branches && npm run start:prod
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: "https://lakzee-fitness.vercel.app"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: GOOGLE_SCRIPT_URL
        sync: false
      - key: GOOGLE_SCRIPT_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
